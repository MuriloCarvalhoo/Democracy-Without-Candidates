<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1f4e79">
  <title>Sem conexão — Democracia Sem Candidatos</title>
  <link rel="icon" href="/icon.svg">
  <style>
    :root { --bg: #f7f7f5; --fg: #1b1b1b; --card: #fff; --border: #d0d0cc; --accent: #1f4e79; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; line-height: 1.5; color: var(--fg); background: var(--bg); }
    @media (prefers-color-scheme: dark) { :root { --bg: #121417; --fg: #ececec; --card: #1c1f24; --border: #3a3f46; --accent: #8cc4ff; } }
    body { margin: 0; background: var(--bg); }
    main { max-width: 36rem; margin: 2rem auto; padding: 1rem; }
    section { background: var(--card); border: 1px solid var(--border); border-radius: .5rem; padding: 1rem; }
    a { color: var(--accent); }
  </style>
</head>
<body>
  <main>
    <section role="alert">
      <h1>Sem conexão</h1>
      <p>Esta aplicação funciona somente online. Nenhuma ação foi guardada para envio posterior e nada foi enviado enquanto você estava sem conexão.</p>
      <p>Quando a conexão voltar, <a href="/">recarregue a página</a> e confira o estado antes de repetir qualquer ação.</p>
    </section>
  </main>
</body>
</html>
