[package]
name = "dwc"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
leptos = "0.8.22"
leptos_router = "0.8.17"
leptos_meta = "0.8.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
console_error_panic_hook = { version = "0.1", optional = true }
wasm-bindgen = { version = "=0.2.129", optional = true }
web-sys = { version = "0.3", optional = true }

# Server-only dependencies
axum = { version = "0.8.9", optional = true }
leptos_axum = { version = "0.8.10", optional = true }
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "signal", "time", "sync"], optional = true }
tower = { version = "0.5", optional = true }
tower-http = { version = "0.6", features = ["limit"], optional = true }
turso = { version = "0.8.3", optional = true }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"], optional = true }
uuid = { version = "1", features = ["v4"], optional = true }
rand = { version = "0.9", optional = true }
sha2 = { version = "0.10", optional = true }
hex = { version = "0.4", optional = true }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"], optional = true }
base64 = { version = "0.22.1", optional = true }

[dev-dependencies]
tempfile = "3"
fantoccini = { version = "0.22.1", default-features = false, features = ["rustls-tls"] }

[features]
hydrate = [
    "leptos/hydrate",
    "dep:console_error_panic_hook",
    "dep:wasm-bindgen",
    "dep:web-sys",
]
ssr = [
    "dep:axum",
    "dep:leptos_axum",
    "dep:tokio",
    "dep:tower",
    "dep:tower-http",
    "dep:turso",
    "dep:chrono",
    "dep:uuid",
    "dep:rand",
    "dep:sha2",
    "dep:hex",
    "dep:tracing",
    "dep:tracing-subscriber",
    "dep:reqwest",
    "dep:base64",
    "leptos/ssr",
    "leptos_meta/ssr",
    "leptos_router/ssr",
]

[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

[package.metadata.leptos]
output-name = "dwc"
site-root = "target/site"
site-pkg-dir = "pkg"
style-file = "style/main.css"
assets-dir = "public"
site-addr = "127.0.0.1:3000"
reload-port = 3001
browserquery = "defaults"
env = "DEV"
bin-features = ["ssr"]
bin-default-features = false
lib-features = ["hydrate"]
lib-default-features = false
lib-profile-release = "wasm-release"

[[test]]
name = "e2e"
required-features = ["ssr"]
