<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2238b0">
  <title>Sem conexão — Democracia Sem Candidatos</title>
  <link rel="icon" href="/icon.svg">
  <style>
    :root { --bg: #f3f4f7; --fg: #161c2b; --muted: #4a5268; --card: #fff; --border: #d5d9e2; --accent: #2238b0; --danger: #ae1f2b; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; line-height: 1.55; color: var(--fg); background: var(--bg); }
    @media (prefers-color-scheme: dark) { :root { --bg: #0f131b; --fg: #e7eaf2; --muted: #a9b0c2; --card: #171c27; --border: #2c3445; --accent: #93a6ff; --danger: #ff9aa2; } }
    body { margin: 0; background: var(--bg); }
    main { max-width: 36rem; margin: 3rem auto; padding: 0 1rem; }
    section { background: var(--card); border: 1px solid var(--border); border-top: 4px solid var(--danger); border-radius: 8px; padding: 1.5rem; }
    h1 { margin: 0 0 .75rem; font-size: 1.6rem; letter-spacing: -.02em; }
    a { color: var(--accent); font-weight: 600; }
  </style>
</head>
<body>
  <main>
    <section role="alert">
      <h1>Sem conexão</h1>
      <p>Esta aplicação funciona somente online. Nenhuma ação foi guardada para envio posterior e nada foi enviado enquanto você estava sem conexão.</p>
      <p>Quando a conexão voltar, <a href="/">recarregue a página</a> e confira o estado antes de repetir qualquer ação.</p>
    </section>
  </main>
</body>
</html>
